    <!--
      Per-page metadata is owned by `useSeo` and written into each prerendered
      file at build time. The defaults below carry `data-seo` so the hook
      replaces them instead of leaving two titles or two descriptions behind.
    -->
    <title data-seo>AS Biz Dev — Développement commercial Afrique &amp; Moyen-Orient</title>
    <meta
      data-seo
      name="description"
      content="AS Biz Dev accompagne les PME dans l'ouverture, le développement et le pilotage de leurs marchés export en Afrique et au Moyen-Orient."
    />
  </head>
